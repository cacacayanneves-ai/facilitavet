services:
  db:
    image: postgres:16-alpine
    container_name: facilitavet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: facilitavet
    ports:
      - '5432:5432'
    volumes:
      - facilitavet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d facilitavet']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  facilitavet-pgdata:
